az_start_deg: 30
batch_size: 256
buffer_size: 200000
curr_inc: 0.1
curr_start: 1.0
curr_te_boost: 0.0
curr_te_halflife: 20000
curr_up: 0.65
curriculum: false        # warm-start: 이미 full task 도달 → 커리큘럼 재시작(퇴행) 방지
curriculum_mode: distance
eps: 0.2
eval_entropy: true
eval_freq: 10000
frame_skip: 20
gamma: 0.98
goal_azimuth_limit_deg: 120
goal_selection_strategy: future
learning_rate: 0.0003
learning_starts: 2000
max_steps: 400
n_eval: 15
n_eval_full: 50
n_obstacles: 3
n_sampled_goal: 4
normalize_goal: true
obs_goal_margin: 0.4
obs_hgt_range:
- 0.7
- 2.8
obs_len_range:
- 0.3
- 1.2
obs_path_corridor: 0.6
obs_path_relevant: 1
obs_place_tries: 20
obs_start_margin: 0.3
obs_wid_range:
- 0.3
- 1.2
obstacle_training: true
random_start: false
reward: reward_decomposed
run_name: Version4/v5_stuck
seed: 0
target_entropy: -4.0
total_steps: 500000       # resume 시 추가 스텝(warm-start fine-tune)
ttc_max: 1.5
video_freq: 0
w_ttc: 0.2
w_stuck: 0.1              # 정지 페널티 가중(게이팅: goal에서 멀 때만)
stuck_motion_thr: 0.01    # 스텝당 qpos 변화 norm 임계(미만=정지)
stuck_gate_eps: 3.0       # goal 근처(eps_n×3) 이내면 정지 허용
